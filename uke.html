<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <!-- Egne Apple-tagger slik at "Legg til på Hjemskjermen" fra DENNE siden
       åpner akkurat denne siden i fullskjerm, uavhengig av hovedappens manifest -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Ukeoversikt"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
  <title>Ukeoversikt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#F5F4F0;--surface:#FFFFFF;--surface2:#EFEFEB;
      --text:#1A1A18;--text2:#6B6B65;--text3:#A8A8A2;
      --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
      --today-bg:#FFF6DE;--today-border:#E3B341;
      --weekend-line:#C9A227;--day-radius:10px;
      --font:'DM Sans',sans-serif;
      --p-rasmus:#185FA5;  --p-rasmus-tint:#E8F1FA;  --p-rasmus-tint-dark:#102840;
      --p-gustav:#2D6A4F;  --p-gustav-tint:#E9F4EE;  --p-gustav-tint-dark:#102A1C;
      --p-kristin:#A3492D; --p-kristin-tint:#FBEEE8; --p-kristin-tint-dark:#3A1D12;
      --p-truls:#6B3FA0;   --p-truls-tint:#F1EAF7;   --p-truls-tint-dark:#271B38;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#111110;--surface:#1C1C1A;--surface2:#242422;
      --text:#F0EFE8;--text2:#9B9B94;--text3:#5A5A55;
      --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
      --today-bg:#2A2410;--today-border:#8A6D1C;
      --p-rasmus-tint:var(--p-rasmus-tint-dark);--p-gustav-tint:var(--p-gustav-tint-dark);
      --p-kristin-tint:var(--p-kristin-tint-dark);--p-truls-tint:var(--p-truls-tint-dark);
    }}
    html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}

    /* ── Login ── */
    #screen-login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    .login-card{width:100%;max-width:360px;background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:28px}
    .login-logo{font-size:26px;font-weight:500;letter-spacing:-0.5px;margin-bottom:6px}
    .login-sub{font-size:14px;color:var(--text2);margin-bottom:22px}
    .form-group{margin-bottom:14px}
    .form-group label{font-size:13px;color:var(--text2);display:block;margin-bottom:5px}
    .form-group input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:16px}
    .form-group input:focus{outline:none;border-color:#185FA5}
    .btn-primary{width:100%;padding:14px;border-radius:10px;background:var(--text);color:var(--bg);font-family:var(--font);font-size:16px;font-weight:500;border:none;cursor:pointer;margin-top:4px}
    .auth-error{color:#A32D2D;font-size:13px;margin-top:10px;min-height:18px}

    /* ── App ── */
    #screen-app{display:none;flex-direction:column;min-height:100dvh;padding:16px 20px;max-width:1400px;margin:0 auto;width:100%}
    #table-wrap{flex:1;min-height:0}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:8px}
    .week-nav{display:flex;align-items:center;gap:8px}
    .week-nav button.nav-arrow{width:26px;height:26px;border-radius:50%;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
    .week-nav button.nav-arrow:disabled{opacity:0.3;cursor:default}
    .week-title-block{display:flex;align-items:baseline;gap:8px}
    .week-title-block h1{font-size:20px;font-weight:600;letter-spacing:-0.3px;white-space:nowrap}
    .week-title-block .sub{font-size:14.5px;color:var(--text2);white-space:nowrap}
    .btn-refresh{padding:6px 13px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:14px;cursor:pointer}
    .btn-refresh:active{opacity:0.7}
    .btn-refresh:disabled{opacity:0.5;cursor:default}

    table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
    th,td{padding:4px 10px;text-align:left;vertical-align:top}
    th{background:var(--bg);padding-top:8px;padding-bottom:6px}
    .person-head{display:flex;align-items:center;gap:6px}
    .person-head svg{width:34.5px;height:34.5px;flex-shrink:0}
    .person-head .name{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em}
    th.col-rasmus .name{color:var(--p-rasmus)}
    th.col-gustav .name{color:var(--p-gustav)}
    th.col-kristin .name{color:var(--p-kristin)}
    th.col-truls .name{color:var(--p-truls)}
    th:first-child,td.day-col{width:75px}
    th:first-child{padding-left:6px;padding-right:3px}
    td.day-col{padding-left:6px;padding-right:3px;font-weight:600;font-size:14px;background:var(--surface) !important;white-space:nowrap}
    td.day-col .date{display:block;font-size:12px;color:var(--text3);font-weight:400;margin-left:0}
    tr.today td.day-col{border-left:3px solid var(--today-border)}
    tr.weekend-start td{border-top:2.5px solid var(--weekend-line)}
    tr.weekend-start td.col-truls{position:relative}
    tr.weekend-start td.col-truls::after{
      content:"HELG";position:absolute;top:-9px;right:2px;font-size:9px;font-weight:700;
      letter-spacing:0.07em;padding:3px 9px;border-radius:999px;display:none;white-space:nowrap;
    }
    .td-inner{display:flex;flex-direction:column;height:100%;min-width:0}
    .skole-items{flex:0 0 auto;margin-bottom:3px;min-width:0}
    .skole-item{font-size:11px;font-style:italic;color:var(--text2);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .content{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;min-width:0}
    .content.push-bottom{justify-content:flex-end}
    .item{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .item+.item{margin-top:0}

    td.col-rasmus{background:var(--p-rasmus-tint)}
    td.col-gustav{background:var(--p-gustav-tint)}
    td.col-kristin{background:var(--p-kristin-tint)}
    td.col-truls{background:var(--p-truls-tint)}
    tr.today td.col-rasmus,tr.today td.col-gustav,tr.today td.col-kristin,tr.today td.col-truls{background:var(--today-bg)}

    /* Hver DAG skal se ut som ÉN avrundet blokk, selv når den (pga mange ulike
       klokkeslett) består av flere underrader under hverandre - ikke én avrundet
       boks per underrad. Derfor: ingen luft MELLOM underradene i samme dag (kun
       en egen "day-gap"-rad MELLOM dager, se under i tabellen), og radius settes
       kun på toppen av dagens FØRSTE underrad og bunnen av dagens SISTE underrad
       (ofte samme rad, hvis dagen bare har én) - mellomliggende underrader
       forblir firkantede, slik at dagblokken henger visuelt sammen som én enhet. */
    tr.day-start td.day-col{border-top-left-radius:var(--day-radius)}
    tr.day-end td.day-col{border-bottom-left-radius:var(--day-radius)}
    tr.day-start td.col-truls{border-top-right-radius:var(--day-radius)}
    tr.day-end td.col-truls{border-bottom-right-radius:var(--day-radius)}
    tr.day-gap td{height:7px;padding:0;border:none;background:transparent}

    #status{text-align:center;padding:60px 20px;color:var(--text2);font-size:15px}
    #status.error{color:#A32D2D}

    /* ── Layout-velger (tabell / kort / tidslinje) ── */
    .layout-switch{display:flex;background:var(--surface2);border-radius:9px;padding:2px;gap:2px}
    .layout-switch button{border:none;background:transparent;padding:5px 10px;border-radius:7px;font-family:var(--font);font-size:12.5px;color:var(--text2);cursor:pointer}
    .layout-switch button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,0.08);font-weight:600}

    /* ── Fargetema-velger (gjelder først og fremst Tabell-visningen) ── */
    .theme-switch{border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:12.5px;padding:6px 10px;border-radius:8px;cursor:pointer}

    /* ── Felles person-fargeklasser (brukes av kort- og tidslinje-layout) ── */
    .p-rasmus-bg{background:var(--p-rasmus)} .p-gustav-bg{background:var(--p-gustav)} .p-kristin-bg{background:var(--p-kristin)} .p-truls-bg{background:var(--p-truls)}
    .p-rasmus-tint{background:var(--p-rasmus-tint)} .p-gustav-tint{background:var(--p-gustav-tint)} .p-kristin-tint{background:var(--p-kristin-tint)} .p-truls-tint{background:var(--p-truls-tint)}
    .p-rasmus-fg{color:var(--p-rasmus)} .p-gustav-fg{color:var(--p-gustav)} .p-kristin-fg{color:var(--p-kristin)} .p-truls-fg{color:var(--p-truls)}
    .avatar-wrap{display:inline-flex;flex-shrink:0}
    .avatar-wrap svg{display:block;width:100%;height:100%}

    /* ── Layout A: Myke kort ── */
    .layout-cards #table-wrap{overflow-y:auto}
    .day-card{background:var(--surface);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,0.04),0 3px 10px rgba(0,0,0,0.05)}
    .day-card.weekend{background:var(--today-bg);border:1px solid var(--today-border)}
    .day-card.today{outline:2px solid var(--today-border);outline-offset:-1px}
    .day-card-head{display:flex;align-items:baseline;gap:7px;margin-bottom:9px}
    .day-card-head .dname{font-size:14.5px;font-weight:700}
    .day-card-head .ddate{font-size:12px;color:var(--text3)}
    .day-card-head .helg-badge{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:0.06em;color:#8a6d1c;background:#F3E4B0;border-radius:999px;padding:3px 9px}
    .day-card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .card-person{display:flex;flex-direction:column;gap:4px;min-width:0}
    .card-person .phead{display:flex;align-items:center;gap:5px;margin-bottom:1px}
    .card-person .pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .card-person .pname{font-size:10.5px;font-weight:700;letter-spacing:0.04em}
    .card-chip{border-radius:7px;padding:4px 7px;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-skole{font-size:10px;font-style:italic;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-empty{color:var(--text3);font-size:12px}
    @media(max-width:620px){.day-card-grid{grid-template-columns:repeat(2,1fr)}}

    /* ── Layout B: Tidslinje ── */
    .layout-agenda #table-wrap{overflow-y:auto}
    .agenda-wrap{background:var(--surface);border-radius:18px;padding:0 18px;box-shadow:0 1px 2px rgba(0,0,0,0.04),0 3px 10px rgba(0,0,0,0.05)}
    .agenda-day{padding:13px 0 8px 0;border-top:1px solid var(--border)}
    .agenda-day:first-child{border-top:none}
    .agenda-day.today .agenda-head .dname{text-decoration:underline;text-decoration-color:var(--today-border);text-decoration-thickness:2px}
    .agenda-head{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
    .agenda-head .dname{font-size:14.5px;font-weight:700}
    .agenda-head .ddate{font-size:12px;color:var(--text3)}
    .agenda-head.weekend .dname{color:#8a6d1c}
    .agenda-head .helg-badge{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:0.06em;color:#8a6d1c;background:var(--today-bg);border-radius:999px;padding:3px 9px}
    .agenda-skole-grid{display:flex;gap:18px;flex-wrap:wrap;padding:3px 0 7px 0}
    .agenda-skole-col{display:flex;flex-direction:column;gap:2px;min-width:0}
    .agenda-skole-pname{font-size:9.5px;font-weight:700;letter-spacing:0.05em}
    .agenda-skole-item{font-size:10.5px;font-style:italic;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .agenda-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--border)}
    .agenda-row:first-of-type{border-top:none}
    .agenda-time{width:48px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);text-align:right;flex-shrink:0}
    .agenda-avatars{display:flex;flex-shrink:0}
    .avatar-dot{width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex-shrink:0;border:2px solid var(--surface)}
    .avatar-dot+.avatar-dot{margin-left:-7px}
    .agenda-text{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .agenda-empty{font-size:12px;color:var(--text3);padding:6px 0}

    /* Liggende iPad har mindre høyde å gå på enn stående, så vi strammer inn
       vertikal plass ytterligere når bredden er klart større enn høyden. */
    @media (orientation:landscape) and (min-width:700px){
      #screen-app{padding:12px 20px}
      header{margin-bottom:8px}
      .week-nav button.nav-arrow{width:22px;height:22px;font-size:14px}
      .week-title-block h1{font-size:18px}
      .week-title-block .sub{font-size:13.5px}
      .btn-refresh{padding:5px 11px;font-size:13px}
      th,td{padding:3px 9px}
      th{padding-top:6px;padding-bottom:5px}
      .person-head svg{width:30px;height:30px}
      .person-head .name{font-size:15px}
      th:first-child,td.day-col{width:66px}
      td.day-col{font-size:12.5px}
      td.day-col .date{font-size:11px}
      .item,.empty-cell{font-size:13px;line-height:1.2}
      .skole-item{font-size:10px}
    }

    @media (max-width:620px){
      table,thead,tbody,tr{display:block}
      thead{display:none}
      tr{margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
      tr.today{border-color:var(--today-border)}
      td{display:flex;gap:10px;border-bottom:1px solid var(--border);align-items:flex-start;padding:6px 10px;font-size:13px}
      td.day-col{background:var(--surface2) !important;font-size:14px;border-radius:0}
      td.col-truls{border-radius:0}
      tr.day-gap{display:none}
      td::before{content:attr(data-person);font-size:11px;font-weight:600;color:var(--text2);min-width:60px;flex-shrink:0;padding-top:1px}
      td.day-col::before{content:none}
      .item{font-size:13px}
      tr.weekend-start td.col-truls::after{display:none !important}
    }

    /* ── Fargetemaer for Tabell-visningen ──────────────────────────────────
       Hvert tema overstyrer bare CSS-variablene over (+ noen få småting som
       skrift, hjørneavrunding og "HELG"-merket) - selve markup/layout-koden
       i uke.js er helt uendret. "Standard" (ingen klasse) er dagens utseende. */

    /* A — Midnight Aurora: mørk, glassy, neon-glød per person */
    body.theme-aurora{
      background:radial-gradient(1200px 500px at 20% -10%, rgba(124,194,255,0.10), transparent),linear-gradient(160deg,#0B0E14,#141925);
      --bg:#0B0E14;--surface:#131722;--surface2:#1B202C;
      --text:#F2F3F6;--text2:#8D93A1;--text3:#5A6270;
      --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.16);
      --today-bg:rgba(230,178,66,0.12);--today-border:#E6B242;
      --weekend-line:#E6B242;--day-radius:14px;
      --p-gustav:#6EE7B7;--p-gustav-tint:rgba(110,231,183,0.14);
      --p-rasmus:#7CC2FF;--p-rasmus-tint:rgba(124,194,255,0.14);
      --p-kristin:#FFAB8A;--p-kristin-tint:rgba(255,171,138,0.14);
      --p-truls:#C9A9FF;--p-truls-tint:rgba(201,169,255,0.14);
    }
    body.theme-aurora tr.weekend-start td.col-truls::after{display:block;color:#1c1407;background:linear-gradient(135deg,#F5D37A,#E0A93A);box-shadow:0 0 10px rgba(230,178,66,0.45)}

    /* B — Citrus Shine: lys, glossy, saturerte "candy"-farger */
    body.theme-citrus{
      --bg:#FAFAF7;--surface:#FFFFFF;--surface2:#F3F1EA;
      --text:#20201C;--text2:#8A8A80;--text3:#B8B6AC;
      --border:rgba(0,0,0,0.06);--border2:rgba(0,0,0,0.12);
      --today-bg:#FFF6DE;--today-border:#E3B341;
      --weekend-line:#E5B84A;--day-radius:14px;
      --p-gustav:#059669;--p-gustav-tint:#E6F7EF;
      --p-rasmus:#2563EB;--p-rasmus-tint:#E1EDFF;
      --p-kristin:#EA580C;--p-kristin-tint:#FFE7D4;
      --p-truls:#7C3AED;--p-truls-tint:#EDE4FB;
    }
    body.theme-citrus tr.weekend-start td.col-truls::after{display:block;color:#5C4208;background:linear-gradient(135deg,#F7D77A,#E5B84A);box-shadow:0 4px 10px rgba(213,164,50,0.35)}

    /* C — Høstglød: varme, jordnære høstfarger */
    body.theme-hostglod{
      --bg:#F7EFE3;--surface:#FFFCF6;--surface2:#F1E6D3;
      --text:#3B2A1E;--text2:#8A7458;--text3:#C2AD8D;
      --border:rgba(139,90,43,0.12);--border2:rgba(139,90,43,0.2);
      --today-bg:#F3E3C4;--today-border:#C9922E;
      --weekend-line:#D9A03C;--day-radius:12px;
      --p-gustav:#5C7A3C;--p-gustav-tint:#E9F0DC;
      --p-rasmus:#C2671C;--p-rasmus-tint:#FBE7CB;
      --p-kristin:#842F34;--p-kristin-tint:#F6DEDD;
      --p-truls:#623F67;--p-truls-tint:#EDE1EE;
    }
    body.theme-hostglod tr.weekend-start td.col-truls::after{display:block;color:#4A3309;background:linear-gradient(135deg,#F0C169,#D9A03C);box-shadow:0 4px 10px rgba(201,146,46,0.35)}

    /* D — Vinterfrost: kjølige, snødekte vinterfarger */
    body.theme-vinterfrost{
      --bg:#EEF4F9;--surface:#FFFFFF;--surface2:#E3EDF5;
      --text:#1E2B36;--text2:#6E8494;--text3:#A9BCC8;
      --border:rgba(62,124,177,0.12);--border2:rgba(62,124,177,0.2);
      --today-bg:#DCEAF8;--today-border:#3E7CB1;
      --weekend-line:#3E7CB1;--day-radius:12px;
      --p-gustav:#2F6F62;--p-gustav-tint:#DCEEE8;
      --p-rasmus:#3E7CB1;--p-rasmus-tint:#DCEAF8;
      --p-kristin:#A32D3F;--p-kristin-tint:#F7DEE2;
      --p-truls:#6E5A9E;--p-truls-tint:#E7E1F3;
    }
    body.theme-vinterfrost tr.weekend-start td.col-truls::after{display:block;color:#1C3B52;background:linear-gradient(135deg,#D7EBFB,#AFD4EF);box-shadow:0 4px 10px rgba(62,124,177,0.3)}

    /* E — Nexus HUD: mørk, sci-fi/cockpit-følelse, monospace + skarpe hjørner */
    body.theme-nexus{
      background:radial-gradient(900px 500px at 50% -15%, rgba(41,224,255,0.08), transparent),#05070A;
      --bg:#05070A;--surface:#0A1016;--surface2:#111920;
      --text:#D6F3FF;--text2:#6E8896;--text3:#3E5661;
      --border:rgba(41,224,255,0.16);--border2:rgba(41,224,255,0.28);
      --today-bg:rgba(255,180,60,0.14);--today-border:#FFB43C;
      --weekend-line:#FFB43C;--day-radius:3px;
      --p-gustav:#39FF88;--p-gustav-tint:rgba(57,255,136,0.10);
      --p-rasmus:#29E0FF;--p-rasmus-tint:rgba(41,224,255,0.10);
      --p-kristin:#FF4FA3;--p-kristin-tint:rgba(255,79,163,0.10);
      --p-truls:#B46BFF;--p-truls-tint:rgba(180,107,255,0.10);
    }
    body.theme-nexus #table-wrap,body.theme-nexus .person-head .name,body.theme-nexus td.day-col{font-family:'DM Mono',monospace;letter-spacing:0.04em}
    body.theme-nexus tr.weekend-start td.col-truls::after{display:block;content:"⚠ HELG";font-family:'DM Mono',monospace;color:#1A1203;background:linear-gradient(135deg,#FFD27A,#FFA93C);box-shadow:0 0 10px rgba(255,169,60,0.5)}

    /* F — Control Room: mørkt fiolett glasspanel, dashbord-inspirert */
    body.theme-controlroom{
      background:radial-gradient(760px 420px at 85% -10%, rgba(123,97,255,0.20), transparent),radial-gradient(640px 400px at 0% 100%, rgba(66,140,255,0.12), transparent),linear-gradient(160deg,#171331,#100D22);
      --bg:#171331;--surface:#1E1A3D;--surface2:#241F4A;
      --text:#ECE9F7;--text2:#9D97C4;--text3:#655E8C;
      --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);
      --today-bg:rgba(255,154,77,0.14);--today-border:#FF9A4D;
      --weekend-line:#FF9A4D;--day-radius:16px;
      --p-gustav:#4ADE94;--p-gustav-tint:rgba(74,222,148,0.12);
      --p-rasmus:#79B8FF;--p-rasmus-tint:rgba(121,184,255,0.12);
      --p-kristin:#FF8FC0;--p-kristin-tint:rgba(255,143,192,0.12);
      --p-truls:#C2A8FF;--p-truls-tint:rgba(194,168,255,0.12);
    }
    body.theme-controlroom tr.weekend-start td.col-truls::after{display:block;color:#fff;background:linear-gradient(135deg,#FF9A4D,#E8602A);box-shadow:0 6px 16px rgba(232,96,42,0.4)}
  </style>
</head>
<body>

  <div id="screen-login">
    <div class="login-card">
      <div class="login-logo">Ukeoversikt</div>
      <div class="login-sub">Logg inn for å koble til familie-appen</div>
      <div class="form-group">
        <label>E-post</label>
        <input type="email" id="login-email" autocomplete="username" inputmode="email"/>
      </div>
      <div class="form-group">
        <label>Passord</label>
        <input type="password" id="login-password" autocomplete="current-password"/>
      </div>
      <button class="btn-primary" id="btn-login">Logg inn</button>
      <div class="auth-error" id="auth-error"></div>
    </div>
  </div>

  <div id="screen-app">
    <header>
      <div class="week-title-block">
        <h1 id="week-title">Denne uken</h1>
        <div class="sub" id="week-sub"></div>
      </div>
      <div class="week-nav">
        <button class="nav-arrow" id="btn-prev-week" aria-label="Forrige uke">&#8249;</button>
        <button class="nav-arrow" id="btn-next-week" aria-label="Neste uke">&#8250;</button>
      </div>
      <div class="layout-switch" id="layout-switch">
        <button data-layout="table">Tabell</button>
        <button data-layout="cards">Kort</button>
        <button data-layout="agenda">Tidslinje</button>
      </div>
      <select class="theme-switch" id="theme-switch" aria-label="Fargetema">
        <option value="standard">Standard</option>
        <option value="aurora">Midnight Aurora</option>
        <option value="citrus">Citrus Shine</option>
        <option value="hostglod">Høstglød</option>
        <option value="vinterfrost">Vinterfrost</option>
        <option value="nexus">Nexus HUD</option>
        <option value="controlroom">Control Room</option>
      </select>
      <button class="btn-refresh" id="btn-refresh">Oppdater</button>
    </header>
    <div id="table-wrap"></div>
  </div>

  <script src="uke.js"></script>
</body>
</html>
