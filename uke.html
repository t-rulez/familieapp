<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <!-- Egne Apple-tagger slik at "Legg til på Hjemskjermen" fra DENNE siden
       åpner akkurat denne siden i fullskjerm, uavhengig av hovedappens manifest -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Ukeoversikt"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
  <title>Ukeoversikt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#F5F4F0;--surface:#FFFFFF;--surface2:#EFEFEB;
      --text:#1A1A18;--text2:#6B6B65;--text3:#A8A8A2;
      --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
      --today-bg:#FFF6DE;--today-border:#E3B341;
      --weekend-line:#C9A227;--weekend-overlay:rgba(0,0,0,0.07);--day-radius:10px;
      --font:'Plus Jakarta Sans',sans-serif;
      --fs:1; /* tekststørrelse for INNHOLDET i de fire personkolonnene (aktiviteter,
               lekser, tilleggslinjer), settes av A−/A+ (uke.js). Dagkolonnen, varmepanelet,
               kolonnehodet og overskriften har bevisst fast størrelse. */
      --p-rasmus:#185FA5;  --p-rasmus-tint:#E8F1FA;  --p-rasmus-tint-dark:#102840;
      --p-gustav:#2D6A4F;  --p-gustav-tint:#E9F4EE;  --p-gustav-tint-dark:#102A1C;
      --p-kristin:#A3492D; --p-kristin-tint:#FBEEE8; --p-kristin-tint-dark:#3A1D12;
      --p-truls:#6B3FA0;   --p-truls-tint:#F1EAF7;   --p-truls-tint-dark:#271B38;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#111110;--surface:#1C1C1A;--surface2:#242422;
      --text:#F0EFE8;--text2:#9B9B94;--text3:#5A5A55;
      --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
      --today-bg:#2A2410;--today-border:#8A6D1C;
      --weekend-overlay:rgba(255,255,255,0.08);
      --p-rasmus-tint:var(--p-rasmus-tint-dark);--p-gustav-tint:var(--p-gustav-tint-dark);
      --p-kristin-tint:var(--p-kristin-tint-dark);--p-truls-tint:var(--p-truls-tint-dark);
    }}
    html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}

    /* ── Login ── */
    #screen-login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    .login-card{width:100%;max-width:360px;background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:28px}
    .login-logo{font-size:26px;font-weight:500;letter-spacing:-0.5px;margin-bottom:6px}
    .login-sub{font-size:14px;color:var(--text2);margin-bottom:22px}
    .form-group{margin-bottom:14px}
    .form-group label{font-size:13px;color:var(--text2);display:block;margin-bottom:5px}
    .form-group input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:16px}
    .form-group input:focus{outline:none;border-color:#185FA5}
    .btn-primary{width:100%;padding:14px;border-radius:10px;background:var(--text);color:var(--bg);font-family:var(--font);font-size:16px;font-weight:500;border:none;cursor:pointer;margin-top:4px}
    .auth-error{color:#A32D2D;font-size:13px;margin-top:10px;min-height:18px}

    /* ── App ── */
    #screen-app{display:none;flex-direction:column;height:var(--app-h,100dvh);overflow:hidden;padding:16px 20px;max-width:1400px;margin:0 auto;width:100%}
    #content-row{flex:1;min-height:0;display:flex;gap:14px}
    #table-wrap{flex:1;min-height:0;min-width:0;overflow:hidden}

    /* ── Varmepanel: vertikal slider for home-control (1-5) + romtemperaturer, til høyre for tabellen ── */
    #heating-panel{
      --heat-color:#E8C547;
      width:92px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;
      background:var(--surface);border:1px solid var(--border2);border-radius:var(--day-radius,14px);
      padding:12px 0 10px;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,0.04),0 3px 10px rgba(0,0,0,0.05);
    }
    .heat-num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--heat-color);line-height:1;transition:color 0.15s;flex-shrink:0}
    /* Fast høyde (ikke flex:1) - slideren skal sitte samlet øverst, ikke sentreres
       midt i hele kolonnen med tomrom rundt. Resten av kolonnen går til romlisten. */
    .heat-track{flex:0 0 120px;height:120px;display:flex;align-items:center;justify-content:center;width:100%}
    /* NB: "writing-mode: vertical-lr" for å lage en vertikal range-input er IKKE
       pålitelig på tvers av Safari/iPadOS (slideren kan kollapse til kun en sirkel/
       prikk der). Bruker i stedet den velprøvde transform:rotate(-90deg)-metoden,
       med forhåndsbredden (108px) satt til å matche .heat-track sin faste høyde
       (120px, minus litt margin til thumb) - fungerer identisk i alle nettlesere. */
    #heat-slider{
      -webkit-appearance:none;appearance:none;
      width:108px;height:34px;margin:0;background:transparent;
      transform:rotate(-90deg);cursor:pointer;flex-shrink:0;
    }
    #heat-slider::-webkit-slider-runnable-track{
      height:6px;border-radius:999px;
      background:linear-gradient(90deg,#6FA8DC,#4FBF8B,#E8C547,#E8974B,#E85D4B);
    }
    #heat-slider::-webkit-slider-thumb{
      -webkit-appearance:none;width:24px;height:24px;border-radius:50%;
      background:#fff;border:3px solid var(--heat-color);box-shadow:0 1px 4px rgba(0,0,0,0.25);
      margin-top:-9px;transition:border-color 0.15s;
    }
    #heat-slider::-moz-range-track{
      height:6px;border-radius:999px;
      background:linear-gradient(90deg,#6FA8DC,#4FBF8B,#E8C547,#E8974B,#E85D4B);
    }
    #heat-slider::-moz-range-thumb{
      width:24px;height:24px;border-radius:50%;border:3px solid var(--heat-color);
      background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.25);transition:border-color 0.15s;
    }
    #heat-slider:-moz-range-progress{background:var(--heat-color)}
    .heat-status{font-size:9.5px;color:var(--text3);text-align:center;letter-spacing:0.02em;min-height:12px;white-space:nowrap;flex-shrink:0}

    /* Romtemperaturer - fyller resten av kolonnen, scroller internt hvis mange rom
       (holder seg innenfor én-skjerm-regelen i stedet for å presse tabellen). */
    .heat-devices{flex:1;min-height:0;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:2px 6px 0}
    .heat-device{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;flex-shrink:0}
    .heat-device-name{font-size:8.5px;font-weight:600;color:var(--text2);line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .heat-device-row{display:flex;align-items:center;justify-content:center;gap:3px}
    /* Grader og ikoner i varmepanelet har samme størrelse, vekt og farge som
       været i dagkolonnen (td.day-col .weather / .weather-icon). Endres det ene,
       må det andre følge med. */
    .heat-device-temp{font-size:15px;font-weight:600;color:var(--text2)}
    .heat-device-temp.offline{color:var(--text3);font-weight:600}
    .heat-flame{font-size:18px;line-height:1;filter:grayscale(1);opacity:0.4}
    .heat-flame.on{filter:none;opacity:1}
    .heat-offline-icon{width:18px;height:18px;flex-shrink:0;color:#E0463A}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:8px}
    .week-nav{display:flex;align-items:center;gap:8px}
    .week-nav button.nav-arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
    .header-controls{display:flex;align-items:center;gap:8px}
    .week-nav button.nav-arrow:disabled{opacity:0.3;cursor:default}
    .week-title-block{display:flex;align-items:baseline;gap:8px}
    .week-title-block h1{font-size:20px;font-weight:800;letter-spacing:-0.03em;white-space:nowrap}
    .week-title-block .sub{font-size:14.5px;color:var(--text2);white-space:nowrap}
    .btn-refresh{padding:6px 13px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:14px;cursor:pointer}
    .btn-refresh:active{opacity:0.7}
    .btn-refresh:disabled{opacity:0.5;cursor:default}

    table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
    th,td{padding:4px 10px;text-align:left;vertical-align:top}
    th{background:var(--bg);padding-top:8px;padding-bottom:6px}
    .person-head{display:flex;align-items:center;gap:6px}
    .person-head svg{width:34.5px;height:34.5px;flex-shrink:0}
    .person-head .name{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em}
    th.col-rasmus .name{color:var(--p-rasmus)}
    th.col-gustav .name{color:var(--p-gustav)}
    th.col-kristin .name{color:var(--p-kristin)}
    th.col-truls .name{color:var(--p-truls)}
    th:first-child,td.day-col{width:85px}
    th:first-child{padding-left:6px;padding-right:3px}
    td.day-col{padding-left:6px;padding-right:3px;font-weight:700;letter-spacing:-0.02em;font-size:20px;background:var(--surface) !important;white-space:nowrap}
    td.day-col .date{display:block;font-size:14px;color:var(--text3);font-weight:500;letter-spacing:0.01em;margin-left:0}
    /* Vær fra MET Norway (Yr) - egen linje under datoen. Emoji + maks-temp. */
    td.day-col .weather{display:flex;align-items:center;gap:3px;font-size:15px;color:var(--text2);font-weight:600;margin-top:2px;white-space:nowrap}
    td.day-col .weather-icon{font-size:18px;line-height:1}
    /* "I dag"-ramme: en tynn, hel linje horisontalt rundt HELE dagens blokk -
       strek over dagens første underrad og strek under dagens siste underrad. */
    tr.today.day-start td{border-top:1.5px solid var(--today-border)}
    tr.today.day-end td{border-bottom:1.5px solid var(--today-border)}
    tr.weekend-start td.col-truls{position:relative}
    tr.weekend-start td.col-truls::after{
      content:"HELG";position:absolute;top:-9px;right:2px;font-size:9px;font-weight:700;
      letter-spacing:0.07em;padding:3px 9px;border-radius:999px;display:block;white-space:nowrap;
      color:#8a6d1c;background:#F3E4B0;box-shadow:0 2px 6px rgba(201,146,39,0.3);
    }
    .td-inner{display:flex;flex-direction:column;height:100%;min-width:0}
    .skole-items{flex:0 0 auto;margin-bottom:3px;min-width:0}
    .skole-item{font-size:calc(13px * var(--fs));font-weight:500;letter-spacing:0.005em;color:var(--text2);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .content{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;min-width:0}
    .content.push-bottom{justify-content:flex-end}
    .item{font-size:calc(16px * var(--fs));line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .item+.item{margin-top:0}
    /* Klokkeslett først i en aktivitet: fet og med like brede siffer, så tidene
       står pent under hverandre (settes av displayItemText() i uke.js). */
    .item .t{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
    /* Tilleggslinjer ('+' fra backend): samme dempede skrift som skole-/lekselinjene */
    .item.extra{font-size:calc(13px * var(--fs));font-weight:500;letter-spacing:0.005em;color:var(--text2);line-height:1.25}

    td.col-rasmus{background:var(--p-rasmus-tint)}
    td.col-gustav{background:var(--p-gustav-tint)}
    td.col-kristin{background:var(--p-kristin-tint)}
    td.col-truls{background:var(--p-truls-tint)}
    /* Lørdag og søndag beholder hver persons egen farge, men et tynt lag mørkere
       (lyse temaer) eller lysere (mørke temaer) legges over - altså samme
       fargefamilie som resten av uken, bare en anelse mer markert. "I dag" skal
       fortsatt vinne visuelt hvis dagens dato er en helgedag, så today-regelen
       kommer etter og overstyrer. */
    tr.weekend td.col-rasmus{background:linear-gradient(var(--weekend-overlay),var(--weekend-overlay)),var(--p-rasmus-tint)}
    tr.weekend td.col-gustav{background:linear-gradient(var(--weekend-overlay),var(--weekend-overlay)),var(--p-gustav-tint)}
    tr.weekend td.col-kristin{background:linear-gradient(var(--weekend-overlay),var(--weekend-overlay)),var(--p-kristin-tint)}
    tr.weekend td.col-truls{background:linear-gradient(var(--weekend-overlay),var(--weekend-overlay)),var(--p-truls-tint)}
    tr.today td.col-rasmus,tr.today td.col-gustav,tr.today td.col-kristin,tr.today td.col-truls{background:var(--today-bg)}

    /* Hver DAG skal se ut som ÉN avrundet blokk, selv når den (pga mange ulike
       klokkeslett) består av flere underrader under hverandre - ikke én avrundet
       boks per underrad. Derfor: ingen luft MELLOM underradene i samme dag (kun
       en egen "day-gap"-rad MELLOM dager, se under i tabellen), og radius settes
       kun på toppen av dagens FØRSTE underrad og bunnen av dagens SISTE underrad
       (ofte samme rad, hvis dagen bare har én) - mellomliggende underrader
       forblir firkantede, slik at dagblokken henger visuelt sammen som én enhet. */
    tr.day-start td.day-col{border-top-left-radius:var(--day-radius)}
    tr.day-end td.day-col{border-bottom-left-radius:var(--day-radius)}
    tr.day-start td.col-truls{border-top-right-radius:var(--day-radius)}
    tr.day-end td.col-truls{border-bottom-right-radius:var(--day-radius)}
    tr.day-gap td{height:7px;padding:0;border:none;background:transparent}

    #status{text-align:center;padding:60px 20px;color:var(--text2);font-size:15px}
    #status.error{color:#A32D2D}

    /* ── Fargetema-velger ── */
    .font-size-ctrl{display:flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden;background:var(--surface)}
    .font-size-ctrl button{border:none;background:transparent;color:var(--text);font-family:var(--font);font-size:13px;font-weight:600;padding:6px 10px;cursor:pointer;line-height:1}
    .font-size-ctrl button+button{border-left:1px solid var(--border2)}
    .font-size-ctrl button:disabled{opacity:0.35;cursor:default}
    .theme-switch{border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:12.5px;padding:6px 10px;border-radius:8px;cursor:pointer}

    /* Liggende iPad har mindre høyde å gå på enn stående, så vi strammer inn
       vertikal plass ytterligere når bredden er klart større enn høyden. */
    @media (orientation:landscape) and (min-width:700px){
      #screen-app{padding:12px 20px}
      header{margin-bottom:8px}
      .week-nav button.nav-arrow{width:32px;height:32px;font-size:18px}
      .week-title-block h1{font-size:18px}
      .week-title-block .sub{font-size:13.5px}
      .btn-refresh{padding:5px 11px;font-size:13px}
      th,td{padding:3px 9px}
      th{padding-top:6px;padding-bottom:5px}
      .person-head svg{width:30px;height:30px}
      .person-head .name{font-size:15px}
      th:first-child,td.day-col{width:78px}
      td.day-col{font-size:18px}
      td.day-col .date{font-size:13px}
      td.day-col .weather,.heat-device-temp{font-size:14px}
      td.day-col .weather-icon,.heat-flame{font-size:17px}
      .heat-offline-icon{width:17px;height:17px}
      .item,.empty-cell{font-size:calc(15px * var(--fs));line-height:1.2}
      .skole-item{font-size:calc(12px * var(--fs))}
      .item.extra{font-size:calc(12px * var(--fs))}
    }

    /* Mobil (stående telefon): SAMME tabell-layout som iPad, bare strammere -
       smalere dagkolonne, avatar over navnet, mindre skrift og tekst som brytes
       over flere linjer i stedet for å kuttes med "...". Varmepanelet legges som
       en vannrett stripe under tabellen så tabellen får hele bredden.
       fitTableToScreen() i uke.js krymper tabellen til skjermhøyden ned til en
       nedre grense; blir det trangere enn det, scroller tabellen i stedet. */
    @media (max-width:620px){
      /* Hjemskjerm-app (black-translucent + viewport-fit=cover) tegnes under
         statuslinjen - safe-area-inset-top gir luft så headeren ikke skjules. */
      #screen-app{padding:calc(6px + env(safe-area-inset-top)) 6px max(4px, calc(env(safe-area-inset-bottom) - 14px))}
      header{margin-bottom:6px;gap:5px 8px}
      .week-title-block{gap:6px}
      .week-title-block h1{font-size:17px}
      .week-title-block .sub{font-size:12.5px}
      .week-nav button.nav-arrow{width:28px;height:28px;font-size:17px}
      /* Knapperaden: A−/A+, Oppdater og layout-velgeren skal ALLTID stå på én
         linje. Raden tar hele bredden, knappene beholder sin størrelse og
         layout-velgeren krymper ved behov. */
      .header-controls{gap:6px;flex-wrap:nowrap;width:100%}
      .header-controls>*{flex:0 0 auto}
      .btn-refresh{padding:4px 10px;font-size:13px}
      .theme-switch{font-size:12px;padding:4px 6px;flex:1 1 auto;min-width:0;max-width:170px;text-overflow:ellipsis}
      .font-size-ctrl button{padding:4px 9px}

      th,td{padding:2px 3px}
      th{padding-top:2px;padding-bottom:3px}
      th:first-child,td.day-col{width:50px}
      th:first-child{padding-left:4px;padding-right:2px;font-size:11px}
      .person-head{flex-wrap:wrap;align-items:center;gap:1px 3px}
      .person-head svg{width:18px;height:18px}
      .person-head .name{font-size:10.5px;letter-spacing:0.04em}
      td.day-col{padding-left:4px;padding-right:2px;font-size:15px}
      td.day-col .date{font-size:11px}
      td.day-col .weather{font-size:12px;gap:2px}
      td.day-col .weather-icon{font-size:14px}
      .item{font-size:calc(12.5px * var(--fs));line-height:1.15;white-space:normal;overflow-wrap:anywhere}
      .item+.item{margin-top:1px}
      .skole-items{margin-bottom:2px}
      .skole-item{font-size:calc(10px * var(--fs));line-height:1.12;white-space:normal;overflow-wrap:anywhere}
      .item.extra{font-size:calc(10px * var(--fs));line-height:1.12}
      tr.weekend-start td.col-truls::after{font-size:7.5px;padding:2px 6px;top:-7px}
      tr.day-gap td{height:3px}

      #content-row{flex-direction:column;gap:6px}
      #heating-panel{width:100%;flex-direction:row;padding:2px 14px;gap:12px}
      .heat-num{font-size:18px}
      .heat-track{flex:1;width:auto;height:auto}
      #heat-slider{transform:none;width:100%;height:30px}
      #heat-slider::-webkit-slider-runnable-track{width:auto;height:6px;background:linear-gradient(90deg,#6FA8DC,#4FBF8B,#E8C547,#E8974B,#E85D4B)}
      #heat-slider::-webkit-slider-thumb{margin-left:0;margin-top:-9px}
      .heat-status{min-height:0}
      .heat-devices{display:none}
    }

    /* ── Fargetemaer for Tabell-visningen ──────────────────────────────────
       Hvert tema overstyrer bare CSS-variablene over (+ noen få småting som
       skrift, hjørneavrunding og "HELG"-merket) - selve markup/layout-koden
       i uke.js er helt uendret. "Standard" (ingen klasse) er dagens utseende. */

    /* A — Midnight Aurora: mørk, glassy, neon-glød per person */
    body.theme-aurora{
      background:radial-gradient(1200px 500px at 20% -10%, rgba(124,194,255,0.10), transparent),linear-gradient(160deg,#0B0E14,#141925);
      --bg:#0B0E14;--surface:#131722;--surface2:#1B202C;
      --text:#F2F3F6;--text2:#8D93A1;--text3:#5A6270;
      --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.16);
      --today-bg:rgba(230,178,66,0.12);--today-border:#E6B242;
      --weekend-line:#E6B242;--weekend-overlay:rgba(255,255,255,0.10);--day-radius:14px;
      --p-gustav:#6EE7B7;--p-gustav-tint:rgba(110,231,183,0.14);
      --p-rasmus:#7CC2FF;--p-rasmus-tint:rgba(124,194,255,0.14);
      --p-kristin:#FFAB8A;--p-kristin-tint:rgba(255,171,138,0.14);
      --p-truls:#C9A9FF;--p-truls-tint:rgba(201,169,255,0.14);
    }
    body.theme-aurora tr.weekend-start td.col-truls::after{display:block;color:#1c1407;background:linear-gradient(135deg,#F5D37A,#E0A93A);box-shadow:0 0 10px rgba(230,178,66,0.45)}

    /* C — Høstglød: varme, jordnære høstfarger */
    body.theme-hostglod{
      --bg:#F7EFE3;--surface:#FFFCF6;--surface2:#F1E6D3;
      --text:#3B2A1E;--text2:#8A7458;--text3:#C2AD8D;
      --border:rgba(139,90,43,0.12);--border2:rgba(139,90,43,0.2);
      --today-bg:#F3E3C4;--today-border:#C9922E;
      --weekend-line:#D9A03C;--weekend-overlay:rgba(0,0,0,0.06);--day-radius:12px;
      --p-gustav:#5C7A3C;--p-gustav-tint:#E9F0DC;
      --p-rasmus:#C2671C;--p-rasmus-tint:#FBE7CB;
      --p-kristin:#842F34;--p-kristin-tint:#F6DEDD;
      --p-truls:#623F67;--p-truls-tint:#EDE1EE;
    }
    body.theme-hostglod tr.weekend-start td.col-truls::after{display:block;color:#4A3309;background:linear-gradient(135deg,#F0C169,#D9A03C);box-shadow:0 4px 10px rgba(201,146,46,0.35)}

    /* D — Vinterfrost: kjølige, snødekte vinterfarger */
    body.theme-vinterfrost{
      --bg:#EEF4F9;--surface:#FFFFFF;--surface2:#E3EDF5;
      --text:#1E2B36;--text2:#6E8494;--text3:#A9BCC8;
      --border:rgba(62,124,177,0.12);--border2:rgba(62,124,177,0.2);
      --today-bg:#DCEAF8;--today-border:#3E7CB1;
      --weekend-line:#3E7CB1;--weekend-overlay:rgba(0,0,0,0.07);--day-radius:12px;
      --p-gustav:#2F6F62;--p-gustav-tint:#DCEEE8;
      --p-rasmus:#3E7CB1;--p-rasmus-tint:#DCEAF8;
      --p-kristin:#A32D3F;--p-kristin-tint:#F7DEE2;
      --p-truls:#6E5A9E;--p-truls-tint:#E7E1F3;
    }
    body.theme-vinterfrost tr.weekend-start td.col-truls::after{display:block;color:#1C3B52;background:linear-gradient(135deg,#D7EBFB,#AFD4EF);box-shadow:0 4px 10px rgba(62,124,177,0.3)}

    /* Spring Bloom: lyse, friske vårfarger - mint/lysegrønn bunn, blomsterrosa helg-aksent */
    body.theme-spring{
      --bg:#F3F8EF;--surface:#FFFFFF;--surface2:#E8F3E0;
      --text:#28361F;--text2:#6E8560;--text3:#AEC29E;
      --border:rgba(74,124,43,0.12);--border2:rgba(74,124,43,0.2);
      --today-bg:#FCEEF5;--today-border:#E58FB3;
      --weekend-line:#E58FB3;--weekend-overlay:rgba(0,0,0,0.06);--day-radius:14px;
      --p-gustav:#3E8E4F;--p-gustav-tint:#DFF2E2;
      --p-rasmus:#3E8FC9;--p-rasmus-tint:#DCEEFB;
      --p-kristin:#D97756;--p-kristin-tint:#FBE4DA;
      --p-truls:#8B6FB0;--p-truls-tint:#ECE4F6;
    }
    body.theme-spring tr.weekend-start td.col-truls::after{display:block;color:#7A2E4A;background:linear-gradient(135deg,#FBD0E3,#F4A8C7);box-shadow:0 4px 10px rgba(229,143,179,0.35)}

    /* F — Control Room: mørkt fiolett glasspanel, dashbord-inspirert */
    body.theme-controlroom{
      background:radial-gradient(760px 420px at 85% -10%, rgba(123,97,255,0.20), transparent),radial-gradient(640px 400px at 0% 100%, rgba(66,140,255,0.12), transparent),linear-gradient(160deg,#171331,#100D22);
      --bg:#171331;--surface:#1E1A3D;--surface2:#241F4A;
      --text:#ECE9F7;--text2:#9D97C4;--text3:#655E8C;
      --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);
      --today-bg:rgba(255,154,77,0.14);--today-border:#FF9A4D;
      --weekend-line:#FF9A4D;--weekend-overlay:rgba(255,255,255,0.10);--day-radius:16px;
      --p-gustav:#4ADE94;--p-gustav-tint:rgba(74,222,148,0.12);
      --p-rasmus:#79B8FF;--p-rasmus-tint:rgba(121,184,255,0.12);
      --p-kristin:#FF8FC0;--p-kristin-tint:rgba(255,143,192,0.12);
      --p-truls:#C2A8FF;--p-truls-tint:rgba(194,168,255,0.12);
    }
    body.theme-controlroom tr.weekend-start td.col-truls::after{display:block;color:#fff;background:linear-gradient(135deg,#FF9A4D,#E8602A);box-shadow:0 6px 16px rgba(232,96,42,0.4)}
  </style>
</head>
<body>

  <div id="screen-login">
    <div class="login-card">
      <div class="login-logo">Ukeoversikt</div>
      <div class="login-sub">Logg inn for å koble til familie-appen</div>
      <div class="form-group">
        <label>E-post</label>
        <input type="email" id="login-email" autocomplete="username" inputmode="email"/>
      </div>
      <div class="form-group">
        <label>Passord</label>
        <input type="password" id="login-password" autocomplete="current-password"/>
      </div>
      <button class="btn-primary" id="btn-login">Logg inn</button>
      <div class="auth-error" id="auth-error"></div>
    </div>
  </div>

  <div id="screen-app">
    <header>
      <div class="week-title-block">
        <h1 id="week-title">Denne uken</h1>
        <div class="sub" id="week-sub"></div>
      </div>
      <div class="week-nav">
        <button class="nav-arrow" id="btn-prev-week" aria-label="Forrige uke">&#8249;</button>
        <button class="nav-arrow" id="btn-next-week" aria-label="Neste uke">&#8250;</button>
      </div>
      <div class="header-controls">
        <div class="font-size-ctrl" role="group" aria-label="Tekststørrelse">
          <button id="btn-font-down" aria-label="Mindre tekst">A&minus;</button>
          <button id="btn-font-up" aria-label="Større tekst">A+</button>
        </div>
        <button class="btn-refresh" id="btn-refresh">Oppdater</button>
        <select class="theme-switch" id="theme-switch" aria-label="Fargetema">
          <option value="spring">Spring Bloom</option>
          <option value="standard">Summer Breeze</option>
          <option value="hostglod">Autumn Glow</option>
          <option value="vinterfrost">Winter Frost</option>
          <option value="controlroom">Violet Nebula</option>
          <option value="aurora">Midnight Aurora</option>
        </select>
      </div>
    </header>
    <div id="content-row">
      <div id="table-wrap"></div>
      <div id="heating-panel" hidden>
        <div class="heat-num" id="heat-num">–</div>
        <div class="heat-track">
          <input type="range" id="heat-slider" min="1" max="5" step="1" value="3" aria-label="Varmenivå (1–5)">
        </div>
        <div class="heat-status" id="heat-status"></div>
        <div class="heat-devices" id="heat-devices"></div>
      </div>
    </div>
  </div>

  <script src="uke.js"></script>
</body>
</html>
